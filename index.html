<script>
    // ------------------------------------
    // 計時器邏輯
    // ------------------------------------
    const targetDate = new Date("2026-11-01T16:30:00+08:00").getTime();
    
    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance < 0) {
            document.getElementById("countdown-cards").innerHTML = '<span class="text-3xl text-warmSun font-bold">The day has arrived!</span>';
            document.getElementById("dynamic-days-text").innerText = "0";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

        document.getElementById("cd-days").innerText = days.toString().padStart(2, '0');
        document.getElementById("cd-hours").innerText = hours.toString().padStart(2, '0');
        document.getElementById("cd-mins").innerText = minutes.toString().padStart(2, '0');
        
        document.getElementById("dynamic-days-text").innerText = days;
    }

    // 優化：每 60 秒更新一次即可，不用每秒耗費效能
    setInterval(updateCountdown, 60000);
    updateCountdown();

    // ------------------------------------
    // 交通指引摺疊面板邏輯
    // ------------------------------------
    const accordionBtn = document.getElementById('accordion-btn');
    const accordionContent = document.getElementById('accordion-content');
    const accordionIcon = document.getElementById('accordion-icon');

    accordionBtn.addEventListener('click', () => {
        accordionContent.classList.toggle('open');
        accordionIcon.classList.toggle('rotate-180');
    });

    // ------------------------------------
    // 智能表單邏輯 (中央狀態機)
    // ------------------------------------
    function syncFormState() {
        // 取得出席意願狀態
        const attendRadio = document.querySelector('input[name="entry.1715883295"]:checked');
        const isAttending = attendRadio && attendRadio.value === '排除萬難都參加';

        // 抓取各區塊與輸入框
        const attendeesSection = document.getElementById('attendees-section');
        const attendeesInput = document.getElementById('attendees-count');
        const companionSection = document.getElementById('companion-section');
        const companionInput = document.getElementById('companion-name');
        
        const dynamicNeedsSection = document.getElementById('dynamic-needs-section');
        const vegCountSection = document.getElementById('veg-count-section');
        const babyCountSection = document.getElementById('baby-count-section');
        
        const vegYes = document.querySelector('input.veg-radio[value="是"]');
        const babyYes = document.querySelector('input.baby-radio[value="是"]');

        const addressSection = document.getElementById('address-section');
        const paperRadio = document.querySelector('input.invite-radio[value="紙本喜帖"]');

        // 1. 出席人數邏輯
        if (isAttending) {
            attendeesSection.style.display = 'block';
            attendeesInput.required = true;
            // 如果剛從「無法參加」切換回來，清空 0 讓使用者重填
            if (attendeesInput.value === '0') attendeesInput.value = ''; 
        } else {
            attendeesSection.style.display = 'none';
            attendeesInput.required = false;
            // 【關鍵修復】：填入 0 以滿足 Google 後台必填，而不使用 disabled
            attendeesInput.value = '0'; 
        }

        const count = parseInt(attendeesInput.value) || 0;

        // 2. 攜伴名稱邏輯
        if (isAttending && count > 1) {
            companionSection.style.display = 'block';
        } else {
            companionSection.style.display = 'none';
            if(companionInput) companionInput.value = ''; // 清空髒資料
        }

        // 3. 飲食與兒童椅邏輯
        if (isAttending && count > 0) {
            dynamicNeedsSection.style.display = 'block';
            vegCountSection.style.display = (vegYes && vegYes.checked) ? 'block' : 'none';
            babyCountSection.style.display = (babyYes && babyYes.checked) ? 'block' : 'none';
        } else {
            dynamicNeedsSection.style.display = 'none';
            vegCountSection.style.display = 'none';
            babyCountSection.style.display = 'none';

            // 強制重置選項與清空數值
            const vegNo = document.querySelector('input.veg-radio[value="否"]');
            if(vegNo) vegNo.checked = true;
            const vegInput = document.querySelector('input[name="entry.634158418"]');
            if(vegInput) vegInput.value = '';

            const babyNo = document.querySelector('input.baby-radio[value="否"]');
            if(babyNo) babyNo.checked = true;
            const babyInput = document.querySelector('input[name="entry.439071470"]');
            if(babyInput) babyInput.value = '';
        }

        // 4. 喜帖與地址邏輯
        if (paperRadio && paperRadio.checked) {
            addressSection.style.display = 'block';
        } else {
            addressSection.style.display = 'none';
            const addressInput = document.getElementById('physical-address');
            if(addressInput) addressInput.value = '';
        }
    }

    // 監聽所有表單變動，統一觸發狀態機
    const formInputs = document.querySelectorAll('#wedding-form input');
    formInputs.forEach(input => {
        input.addEventListener('change', syncFormState);
        input.addEventListener('input', syncFormState);
    });

    // ------------------------------------
    // Iframe 隱藏提交處理邏輯
    // ------------------------------------
    let submitted = false;
    const form = document.getElementById('wedding-form');
    const hiddenIframe = document.getElementById('hidden_iframe');

    hiddenIframe.addEventListener('load', function() {
        if (submitted) {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-message').classList.remove('hidden');
            document.getElementById('rsvp').scrollIntoView({ behavior: 'smooth' });
        }
    });
    
    form.addEventListener('submit', function(e) {
        const addressVal = document.getElementById('physical-address')?.value || '';
        const blessingVal = document.getElementById('blessing-text')?.value || '';
        
        let combinedFinal = "";
        const paperRadio = document.querySelector('input.invite-radio[value="紙本喜帖"]');
        
        if(paperRadio && paperRadio.checked && addressVal.trim() !== '') {
            combinedFinal += "【收件地址】: " + addressVal + "\n\n";
        }
        if(blessingVal.trim() !== '') {
            combinedFinal += "【祝福留言】:\n" + blessingVal;
        }
        
        document.getElementById('final-blessing-field').value = combinedFinal;
        
        // 標記已提交
        submitted = true;
    });
</script>
